<!doctype html>
<html lang="en">
  <head>
    <script>
      (function() {
        try {
          var originalFetch = window.fetch || globalThis.fetch;
          var activeFetch = originalFetch;

          var descriptor = {
            get: function() {
              return activeFetch;
            },
            set: function(val) {
              activeFetch = val;
            },
            configurable: true,
            enumerable: true
          };

          if (typeof Window !== 'undefined' && Window.prototype) {
            try {
              Object.defineProperty(Window.prototype, 'fetch', descriptor);
            } catch (e) {
              console.warn("Could not define fetch on Window.prototype:", e);
            }
          }

          try {
            Object.defineProperty(window, 'fetch', descriptor);
          } catch (e) {
            console.warn("Could not define fetch on window:", e);
          }

          if (typeof globalThis !== 'undefined' && globalThis !== window) {
            try {
              Object.defineProperty(globalThis, 'fetch', descriptor);
            } catch (e) {
              console.warn("Could not define fetch on globalThis:", e);
            }
          }
        } catch (err) {
          console.warn("Robust fetch patch failed:", err);
        }
      })();
    </script>
